<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고객센터 — FPP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a1626'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23f5b942' stroke-width='3.5'/%3E%3Cpath d='M32 13c-8 0-14 6-14 13 0 5 3 9 7 11v6l4-2 3 3 3-3 4 2v-6c4-2 7-6 7-11 0-7-6-13-14-13z' fill='%23f5b942'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script>
    (function () { try { var t = localStorage.getItem('fpp_theme'); if (t) { try { t = JSON.parse(t); } catch (e) { } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); } } catch (e) { } })();
  </script>
  <style>
    html { background: #0a1626; color-scheme: dark; }
    html[data-theme="light"] { background: #eef3f8; color-scheme: light; }
    #pageVeil { position: fixed; inset: 0; z-index: 9999; pointer-events: none; background: #0a1626; opacity: 1; transition: opacity .25s ease; animation: pageVeilFail .3s ease .9s forwards; }
    html[data-theme="light"] #pageVeil { background: #eef3f8; }
    #pageVeil.off { opacity: 0; }
    @keyframes pageVeilFail { to { opacity: 0; visibility: hidden; } }
  </style>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/CustomerService.css" />
</head>
<body data-page="cs">

  <div id="pageVeil" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"></div>

  <header class="app-header" id="appHeader"></header>
  <div class="drawer-backdrop" id="drawerBack"></div>
  <aside class="drawer" id="navDrawer" aria-label="전체 메뉴"></aside>

  <main>
    <section class="view is-on" id="view-cs">
      <div class="wrap">
        <div class="page-head rv">
          <h1 class="page-title">고객센터</h1>
          <p class="page-desc">공지사항과 자주 묻는 질문을 확인하고, 1:1 문의를 남길 수 있습니다.</p>
        </div>

        <div class="cs-tools rv">
          <div class="cs-search">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="csSearch" placeholder="공지 · FAQ 검색" autocomplete="off" />
          </div>
          <div class="cs-tools-right">
            <div class="chip-row" id="csCats">
              <button class="chip is-on" data-cat="all" type="button">전체</button>
              <button class="chip" data-cat="공지" type="button">공지</button>
              <button class="chip" data-cat="FAQ" type="button">FAQ</button>
            </div>
            <button class="btn btn--gold btn--sm" id="btnMyInq" type="button">내 문의 보기</button>
          </div>
        </div>

        <div class="cs-list rv" id="csList"></div>

        <div class="cs-cta rv">
          <div class="cs-cta-in">
            <span class="cs-cta-ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 12a7 7 0 0 1 14 0v3.5a2 2 0 0 1-2 2h-1.5V13H19" stroke-linejoin="round"/><path d="M5 12v5.5a2 2 0 0 0 2 2H8.5V13H5" stroke-linejoin="round"/><path d="M12 21c2 0 3.5-1 4-2.5" stroke-linecap="round"/></svg></span>
            <div>
              <b>찾는 답변이 없으신가요?</b>
              <small>운영팀이 24시간 이내에 답변드립니다.</small>
            </div>
            <button class="btn btn--gold" id="btnInquiry" type="button">1:1 문의하기</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="wrap ft-in">
      <span class="ft-logo">FPP v2</span>
      <span>원피스 파이팅패스 팬 커뮤니티 — 본 사이트는 비공식 팬 페이지입니다.</span>
      <span>© FPP Community</span>
    </div>
  </footer>

  <nav id="bottomTabs" class="bottom-tabs" aria-label="하단 메뉴"></nav>
  <div id="popupRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <script src="js/Firebase.js"></script>
  <script src="js/common.js"></script>
  <script src="js/CustomerService.js"></script>
</body>
</html>
