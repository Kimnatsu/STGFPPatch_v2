<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — FPP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a1626'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23f5b942' stroke-width='3.5'/%3E%3Cpath d='M32 13c-8 0-14 6-14 13 0 5 3 9 7 11v6l4-2 3 3 3-3 4 2v-6c4-2 7-6 7-11 0-7-6-13-14-13z' fill='%23f5b942'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script>
    (function () { try { var t = localStorage.getItem('fpp_theme'); if (t) { try { t = JSON.parse(t); } catch (e) { } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); } } catch (e) { } })();
  </script>
  <style>
    html { background: #0a1626; color-scheme: dark; }
    html[data-theme="light"] { background: #eef3f8; color-scheme: light; }
    #pageVeil { position: fixed; inset: 0; z-index: 9999; pointer-events: none; background: #0a1626; opacity: 1; transition: opacity .25s ease; animation: pageVeilFail .3s ease .9s forwards; }
    html[data-theme="light"] #pageVeil { background: #eef3f8; }
    #pageVeil.off { opacity: 0; }
    @keyframes pageVeilFail { to { opacity: 0; visibility: hidden; } }
  </style>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/Login.css" />
</head>
<body data-page="login">

  <div id="pageVeil" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"></div>

  <header class="app-header" id="appHeader"></header>
  <div class="drawer-backdrop" id="drawerBack"></div>
  <aside class="drawer" id="navDrawer" aria-label="전체 메뉴"></aside>

  <main class="login-main">
    <div class="wrap">
      <div class="login-grid">
        <div class="login-hero rv">
          <span class="login-mark"><svg viewBox="0 0 64 64" width="74" height="74"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="3.6"/><path d="M32 13c-8 0-14 6-14 13 0 5 3 9 7 11v6l4-2 3 3 3-3 4 2v-6c4-2 7-6 7-11 0-7-6-13-14-13z" fill="currentColor"/></svg></span>
          <h1 class="login-title">다시 만나요,<br><em>선원</em>님</h1>
          <p class="login-sub">로그인하면 꿀팁 작성 · 추천 · 즐겨찾기 등<br>커뮤니티의 모든 기능을 사용할 수 있습니다.</p>
          <ul class="login-points">
            <li><b>꿀팁 작성</b><span>캐릭터별 운영법을 공유하고 BEST에 도전</span></li>
            <li><b>추천 · 댓글</b><span>게시판과 이벤트에서 의견 남기기</span></li>
            <li><b>즐겨찾기</b><span>자주 보는 캐릭터를 한곳에</span></li>
          </ul>
        </div>

        <div class="login-card rv">
          <div class="login-tabs" role="tablist">
            <button class="login-tab is-on" data-mode="in" type="button" role="tab">로그인</button>
            <button class="login-tab" data-mode="up" type="button" role="tab">회원가입</button>
          </div>
          <form id="loginForm" autocomplete="off">
            <div class="field" id="fNick" style="display:none">
              <label for="lgNick">닉네임</label>
              <input id="lgNick" type="text" maxlength="16" placeholder="사용할 닉네임 (2~16자)" />
            </div>
            <div class="field">
              <label for="lgEmail">이메일</label>
              <input id="lgEmail" type="email" placeholder="email@example.com" required />
            </div>
            <div class="field">
              <label for="lgPw">비밀번호</label>
              <input id="lgPw" type="password" placeholder="비밀번호 (6자 이상)" required minlength="6" />
            </div>
            <button class="btn btn--gold btn--block" id="lgSubmit" type="submit">로그인</button>
          </form>
          <div class="login-or"><span>또는</span></div>
          <div class="login-alt">
            <button class="btn btn--ghost btn--block" id="btnDemo" type="button">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l8 4v5c0 4.5-3.2 7.7-8 9-4.8-1.3-8-4.5-8-9V7z" stroke-linejoin="round"/></svg>
              데모 계정으로 체험하기
            </button>
            <button class="btn btn--block login-google" id="btnGoogle" type="button">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="#EA4335" d="M12 5.3c1.6 0 3 .55 4.1 1.62l3.06-3.06C17.3 2.1 14.85 1 12 1 7.6 1 3.8 3.5 1.95 7.15l3.57 2.78C6.4 7.2 8.97 5.3 12 5.3z"/><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.2 3.31l3.4 2.64c1.99-1.84 3.44-4.55 3.44-7.96z"/><path fill="#FBBC05" d="M5.52 14.07A6.6 6.6 0 0 1 5.17 12c0-.72.13-1.42.35-2.07L1.95 7.15A10.94 10.94 0 0 0 1 12c0 1.77.42 3.44 1.95 4.85l3.57-2.78z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.4-2.64c-.95.64-2.17 1.02-3.88 1.02-3.03 0-5.6-1.9-6.48-4.65l-3.57 2.78C3.8 20.5 7.6 23 12 23z"/></svg>
              Google로 계속하기
            </button>
          </div>
          <p class="login-note">데모 환경 — 계정 정보는 이 브라우저에만 저장됩니다.</p>
        </div>
      </div>
    </div>
  </main>

  <nav id="bottomTabs" class="bottom-tabs" aria-label="하단 메뉴"></nav>
  <div id="popupRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <script src="js/Firebase.js"></script>
  <script src="js/common.js"></script>
  <script src="js/Login.js"></script>
</body>
</html>
