<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>커뮤니티 — FPP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a1626'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23f5b942' stroke-width='3.5'/%3E%3Cpath d='M32 13c-8 0-14 6-14 13 0 5 3 9 7 11v6l4-2 3 3 3-3 4 2v-6c4-2 7-6 7-11 0-7-6-13-14-13z' fill='%23f5b942'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script>
    (function () { try { var t = localStorage.getItem('fpp_theme'); if (t) { try { t = JSON.parse(t); } catch (e) { } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); } } catch (e) { } })();
  </script>
  <style>
    html { background: #0a1626; color-scheme: dark; }
    html[data-theme="light"] { background: #eef3f8; color-scheme: light; }
    #pageVeil { position: fixed; inset: 0; z-index: 9999; pointer-events: none; background: #0a1626; opacity: 1; transition: opacity .25s ease; animation: pageVeilFail .3s ease .9s forwards; }
    html[data-theme="light"] #pageVeil { background: #eef3f8; }
    #pageVeil.off { opacity: 0; }
    @keyframes pageVeilFail { to { opacity: 0; visibility: hidden; } }
  </style>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/Community.css" />
</head>
<body data-page="community">

  <div id="pageVeil" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"></div>

  <header class="app-header" id="appHeader"></header>
  <div class="drawer-backdrop" id="drawerBack"></div>
  <aside class="drawer" id="navDrawer" aria-label="전체 메뉴"></aside>

  <main>
    <!-- ===== 커뮤니티 홈 ===== -->
    <section class="view" id="view-comhome">
      <div class="banner banner--community rv">
        <div class="banner-fallback" aria-hidden="true"></div>
        <div class="banner-shade" aria-hidden="true"></div>
        <div class="banner-tag">
          <span class="banner-tag-txt">선원들의 항해 일지</span>
          <span class="banner-tag-sub">패치노트 · 게시판 · 이벤트</span>
        </div>
      </div>
      <div class="wrap">
        <div class="home-quick rv">
          <a class="qcard" href="Community.html#patch">
            <span class="qcard-ic qcard-ic--gold"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 12h6M9.5 15.5h4" stroke-linecap="round"/></svg></span>
            <span><b>패치노트</b><small>월별 밸런스 변경 내역</small></span><span class="qcard-go">›</span>
          </a>
          <a class="qcard" href="Community.html#board">
            <span class="qcard-ic qcard-ic--blue"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg></span>
            <span><b>게시판</b><small>자유 · 정보 · 질문 · 자랑</small></span><span class="qcard-go">›</span>
          </a>
          <a class="qcard" href="Community.html#event">
            <span class="qcard-ic qcard-ic--red"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="9.5" width="16" height="4"/><path d="M5.5 13.5v6.5h13v-6.5M12 9.5v10.5"/></svg></span>
            <span><b>이벤트</b><small>진행 중 · 종료된 이벤트</small></span><span class="qcard-go">›</span>
          </a>
        </div>

        <div class="box rv">
          <div class="box-head"><h2 class="box-title">최신 게시글</h2><a class="box-go" href="Community.html#board">게시판 가기 ›</a></div>
          <div class="box-body" id="comLatest"></div>
        </div>
        <div class="box rv">
          <div class="box-head"><h2 class="box-title">진행 중인 이벤트</h2><a class="box-go" href="Community.html#event">전체 보기 ›</a></div>
          <div class="box-body" id="comEvents"></div>
        </div>
      </div>
    </section>

    <!-- ===== 패치노트 ===== -->
    <section class="view" id="view-patch">
      <div class="wrap">
        <div class="page-head rv">
          <h1 class="page-title">패치노트</h1>
          <p class="page-desc">역대 밸런스 패치와 업데이트 내역을 월별로 확인할 수 있습니다.</p>
        </div>
        <div class="patch-layout">
          <div class="patch-content rv" id="patchContent"></div>
          <aside class="month-filter rv" id="monthFilter" aria-label="월별 필터">
            <h3 class="month-title">월별</h3>
            <select class="month-select" id="monthSelect" aria-label="월 선택"></select>
            <div class="month-list" id="monthList"></div>
          </aside>
        </div>
      </div>
    </section>

    <!-- ===== 게시판 ===== -->
    <section class="view" id="view-board">
      <div class="wrap">
        <div class="page-head rv">
          <h1 class="page-title">게시판</h1>
          <p class="page-desc">선원들과 자유롭게 이야기를 나눠보세요.</p>
        </div>
        <div class="toolbar rv" id="boardToolbar">
          <div class="chip-row" id="boardCats">
            <button class="chip is-on" data-cat="all" type="button">전체</button>
            <button class="chip" data-cat="자유" type="button">자유</button>
            <button class="chip" data-cat="정보" type="button">정보</button>
            <button class="chip" data-cat="질문" type="button">질문</button>
            <button class="chip" data-cat="자랑" type="button">자랑</button>
          </div>
          <div class="toolbar-right">
            <div class="seg" role="group" aria-label="보기 방식">
              <button class="seg-btn" data-view="card" type="button">카드형</button>
              <button class="seg-btn is-on" data-view="list" type="button">목록형</button>
            </div>
            <select id="boardSort" aria-label="정렬">
              <option value="new">최신순</option>
              <option value="old">오래된순</option>
              <option value="like">추천순</option>
            </select>
          </div>
        </div>
        <div class="write-toolbar rv">
          <button class="btn btn--gold write-btn" id="boardWriteBtn" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4.5-1L20 7.5 16.5 4 5 15.5z"/><path d="M14.5 6l3.5 3.5"/></svg>
            글쓰기
          </button>
        </div>
        <div id="boardContent" class="rv"></div>
      </div>
    </section>

    <!-- ===== 이벤트 ===== -->
    <section class="view" id="view-event">
      <div class="wrap">
        <div class="page-head rv">
          <h1 class="page-title">이벤트</h1>
          <p class="page-desc">진행 중이거나 종료된 이벤트를 확인하세요.</p>
        </div>
        <div class="toolbar rv" id="eventToolbar">
          <div class="chip-row" id="eventCats">
            <button class="chip is-on" data-cat="all" type="button">전체</button>
            <button class="chip" data-cat="ing" type="button">진행중</button>
            <button class="chip" data-cat="end" type="button">종료됨</button>
          </div>
          <div class="toolbar-right">
            <div class="seg" role="group" aria-label="보기 방식">
              <button class="seg-btn is-on" data-view="card" type="button">카드형</button>
              <button class="seg-btn" data-view="list" type="button">목록형</button>
            </div>
            <select id="eventSort" aria-label="정렬">
              <option value="new">최신순</option>
              <option value="old">오래된순</option>
              <option value="like">추천순</option>
            </select>
          </div>
        </div>
        <div id="eventContent" class="rv"></div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="wrap ft-in">
      <span class="ft-logo">FPP v2</span>
      <span>원피스 파이팅패스 팬 커뮤니티 — 본 사이트는 비공식 팬 페이지입니다.</span>
      <span>© FPP Community</span>
    </div>
  </footer>

  <nav id="bottomTabs" class="bottom-tabs" aria-label="하단 메뉴"></nav>
  <div id="popupRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <script src="js/Firebase.js"></script>
  <script src="js/common.js"></script>
  <script src="js/Community.js"></script>
</body>
</html>
