<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FPP v2 — 원피스 파이팅패스 커뮤니티</title>
<meta name="description" content="FPP v2 — 캐릭터, PvP 패치, 커뮤니티, 고객센터" />
<link rel="icon" href="image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1626'/%3E%3Cpath d='M32 12c-8 0-14 6-14 13 0 5 3 9 7 11v6l4-2 3 3 3-3 4 2v-6c4-2 7-6 7-11 0-7-6-13-14-13z' fill='%23f5b942'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script>
(function(){try{var t=localStorage.getItem('fpp_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<!-- 최소한의 스타일만 로드하여 깜빡임 방지 -->
<link rel="stylesheet" href="css/common.css" />
<style>
  /* 로딩 중 레이아웃 깨짐 방지를 위한 최소 스타일 */
  body { margin: 0; background: #0a1626; color: #fff; font-family: 'Noto Sans KR', sans-serif; }
  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
  .loading-logo { font-family: 'Black Han Sans', sans-serif; font-size: 3rem; color: #f5b942; margin-bottom: 1rem; animation: pulse 1.5s infinite; }
  .loading-text { font-size: 1.1rem; opacity: 0.8; }
  @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } 100% { opacity: 0.6; transform: scale(0.98); } }
</style>
</head>
<body>

<div class="loading-wrap">
  <div class="loading-logo">FPP v2</div>
  <div class="loading-text">메인 페이지로 이동 중입니다...</div>
</div>

<script>
  // DOMContentLoaded 전에 즉시 실행되어 빠르게 리다이렉트
  (function() {
    // 약간의 지연을 두어 테마 적용 및 폰트 로딩 시간 확보 (사용자가 흰화면을 보지 않도록)
    setTimeout(function() {
      window.location.href = 'Main.html';
    }, 300); // 0.3초 지연 (브라우저가 스타일을 입힐 시간)
  })();
</script>

</body>
</html>
